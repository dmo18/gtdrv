<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rustwater">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Rustwater</title>
<style>
  html, body { margin: 0; height: 100%; background: #14110f; overflow: hidden; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f4efe6; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(circle at 50% 40%, #3a241a, #14110f 70%); z-index: 50; text-align: center; padding: 16px; }
  #boot h1 { margin: 0; font-size: clamp(40px, 11vw, 84px); letter-spacing: 0.08em; color: #e2733a; font-weight: 800; }
  #boot p { margin: 0; opacity: 0.85; font-size: 15px; }
  #play { font: inherit; font-size: 20px; font-weight: 700; color: #14110f; background: #e2733a; border: 0; border-radius: 999px; padding: 14px 44px; min-height: 56px; }
  #play[disabled] { opacity: 0.5; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #14110f; z-index: 60; font-size: 20px; text-align: center; padding: 24px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Rustwater game view"></canvas>
<div id="ui"></div>
<div id="boot">
  <h1>RUSTWATER</h1>
  <p id="bootmsg">Loading the island…</p>
  <button id="play" disabled>Play</button>
</div>
<div id="rotate">Turn your phone sideways to play</div>
<script type="module" src="game.js"></script>
</body>
</html>
