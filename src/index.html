<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rustwater">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Rustwater</title>
<style>
  /* No page background: the canvas covers the whole viewport, insets included (docs/REVAMP.md 6.5). */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f4efe6; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; }
  /* Title screen (docs/REVAMP.md 6.8): name top left, Start and Continue bottom center, credit bottom left, version bottom right.
     0.13.7: dark glass pills, one orange accent, the name in heavy italic with an accent stripe. */
  #boot { --sl: max(env(safe-area-inset-left, 0px), var(--rw-test-sl, 0px)); --sr: max(env(safe-area-inset-right, 0px), var(--rw-test-sr, 0px)); --sb: max(env(safe-area-inset-bottom, 0px), var(--rw-test-sb, 0px)); --st: max(env(safe-area-inset-top, 0px), var(--rw-test-st, 0px));
    --acc: #e2733a; --acc-hi: #f28d55; --glass: rgba(12,16,22,0.66); --edge: rgba(255,255,255,0.16);
    position: fixed; inset: 0; background: radial-gradient(130% 120% at 50% 30%, #1c2531, #07090d 72%); z-index: 50; transition: background-color 0.4s; -webkit-font-smoothing: antialiased; }
  #boot.rw-clear { background: linear-gradient(90deg, rgba(5,7,11,0.55), rgba(5,7,11,0) 45%), linear-gradient(0deg, rgba(5,7,11,0.5), rgba(5,7,11,0) 35%); }
  #boot h1 { position: absolute; left: calc(24px + var(--sl)); top: calc(20px + var(--st)); margin: 0; height: 40px; font-size: 36px; line-height: 40px; letter-spacing: 0.12em; color: #fff; font-weight: 900; font-style: italic; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6); }
  #boot h1::after { content: ""; position: absolute; left: 2px; bottom: -3px; width: 72px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--acc), var(--acc-hi)); transform: skewX(-20deg); }
  #boot p { margin: 0; }
  #bootmsg { position: absolute; left: calc(24px + var(--sl)); top: calc(66px + var(--st)); max-width: 40vw; font-size: 14px; line-height: 20px; padding: 3px 10px; margin-left: -10px; border-radius: 10px; background: var(--glass); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); color: #fff; }
  /* Loading bar under the message: fixed size and place (748x360 up to 915x412), never wider than the map button's left edge. */
  #bootbar { position: absolute; left: calc(24px + var(--sl)); top: calc(96px + var(--st)); width: min(300px, 38vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14); box-shadow: 0 0 0 1px rgba(0,0,0,0.3); overflow: hidden; }
  #bootbar[hidden] { display: none; }
  #bootbarfill { display: block; width: 0; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--acc), var(--acc-hi)); }
  #bootbtns { position: absolute; left: 50%; bottom: calc(24px + var(--sb)); transform: translateX(-50%); display: flex; gap: 16px; }
  #bootbtns button { width: 180px; height: 56px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: inherit; font-size: 19px; font-weight: 700; letter-spacing: 0.02em; border-radius: 999px; border: 0; cursor: pointer; touch-action: manipulation; transition: filter 0.14s ease; }
  #bootbtns button:active { filter: brightness(1.12); }
  #bootbtns button:focus-visible, #boot .rw-aboutbtn:focus-visible, #boot .rw-mapbtn:focus-visible { outline: 2px solid #ffd2b5; outline-offset: 3px; }
  #play { color: #1c0f07; background: linear-gradient(180deg, var(--acc-hi), var(--acc)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 8px 22px rgba(226,115,58,0.35); order: 2; }
  #play::before { content: ""; width: 0; height: 0; border-left: 13px solid currentColor; border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 4px; }
  #play::after { content: "Start"; }
  #play[disabled] { color: rgba(255,255,255,0.85); background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge); cursor: default; }
  #play[disabled]::before { width: 16px; height: 16px; margin: 0; border: 2px solid rgba(255,255,255,0.25); border-top-color: var(--acc-hi); border-radius: 50%; animation: rw-spin 0.9s linear infinite; }
  #play[disabled]::after { content: "Loading"; }
  @keyframes rw-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #play[disabled]::before { animation: none; } #bootbtns button { transition: none; } }
  #continue { color: #fff; background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge), 0 6px 18px rgba(0,0,0,0.3); order: 1; }
  #continue[hidden] { display: none; }
  #boot .rw-aboutbtn, #boot .rw-mapbtn { position: absolute; top: calc(16px + var(--st)); height: 48px; font: inherit; font-size: 15px; font-weight: 600; line-height: 48px; color: #fff; background: var(--glass); border: 0; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 999px; cursor: pointer; touch-action: manipulation; }
  #boot .rw-aboutbtn:active, #boot .rw-mapbtn:active { background: rgba(40,48,60,0.8); }
  #boot .rw-aboutbtn { right: calc(24px + var(--sr)); min-width: 96px; padding: 0 16px; }
  #boot .rw-mapbtn { right: calc(132px + var(--sr)); min-width: 96px; max-width: min(260px, calc(100vw - 420px)); padding: 0 18px 0 36px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #boot .rw-mapbtn::before { content: ""; position: absolute; left: 16px; top: 16px; width: 10px; height: 10px; border: 2px solid var(--acc-hi); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
  #bootcredit, #bootver { position: absolute; bottom: calc(8px + var(--sb)); margin: 0; padding: 2px 8px; border-radius: 999px; font-size: 12px; line-height: 15px; color: rgba(255,255,255,0.92); background: var(--glass); letter-spacing: 0.01em; }
  #bootcredit { left: calc(8px + var(--sl)); }
  #bootver { right: calc(8px + var(--sr)); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, #1c2531, #07090d 72%); color: #f3f5f8; font-weight: 600; z-index: 60; font-size: 20px; text-align: center; padding: 24px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Rustwater game view"></canvas>
<div id="ui"></div>
<div id="boot">
  <h1>RUSTWATER</h1>
  <button id="mapbtn" class="rw-mapbtn" type="button" aria-label="Choose a map">Map</button>
  <button id="aboutbtn" class="rw-aboutbtn" type="button">About</button>
  <p id="bootmsg">Loading the island&hellip;</p>
  <div id="bootbar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bootbarfill"></span></div>
  <div id="bootbtns">
    <button id="continue" type="button" hidden>Continue</button>
    <button id="play" type="button" disabled></button>
  </div>
  <p id="bootcredit">Map data (c) OpenStreetMap contributors, ODbL</p>
  <p id="bootver" class="rw-ver">v{{VERSION}}</p>
</div>
<div id="rotate">Turn your phone sideways to play</div>
<script type="module" src="game.js"></script>
</body>
</html>
