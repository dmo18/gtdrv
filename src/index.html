<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rustwater">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Rustwater</title>
<style>
  /* No page background: the canvas covers the whole viewport, insets included (docs/REVAMP.md 6.5). */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f4efe6; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; }
  /* Title screen (docs/REVAMP.md 6.8): name top left, Start and Continue bottom centre, credit bottom left, version bottom right. */
  #boot { --sl: max(env(safe-area-inset-left, 0px), var(--rw-test-sl, 0px)); --sr: max(env(safe-area-inset-right, 0px), var(--rw-test-sr, 0px)); --sb: max(env(safe-area-inset-bottom, 0px), var(--rw-test-sb, 0px)); --st: max(env(safe-area-inset-top, 0px), var(--rw-test-st, 0px));
    position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, #3a241a, #14110f 70%); z-index: 50; transition: background-color 0.4s; }
  #boot.rw-clear { background: transparent; }
  #boot h1 { position: absolute; left: calc(24px + var(--sl)); top: calc(20px + var(--st)); margin: 0; height: 40px; font-size: 36px; line-height: 40px; letter-spacing: 0.08em; color: #e2733a; font-weight: 800; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
  #boot p { margin: 0; }
  #bootmsg { position: absolute; left: calc(24px + var(--sl)); top: calc(66px + var(--st)); max-width: 40vw; font-size: 14px; line-height: 20px; padding: 2px 8px; margin-left: -8px; border-radius: 6px; background: rgba(0, 0, 0, 0.6); color: #fff; }
  #bootbtns { position: absolute; left: 50%; bottom: calc(24px + var(--sb)); transform: translateX(-50%); display: flex; gap: 16px; }
  #bootbtns button { width: 180px; height: 56px; font: inherit; font-size: 20px; font-weight: 700; border-radius: 999px; cursor: pointer; touch-action: manipulation; }
  #play { color: #14110f; background: #e2733a; border: 2px solid #e2733a; order: 2; }
  #play::after { content: "Start"; }
  #play[disabled] { opacity: 0.6; cursor: default; }
  #play[disabled]::after { content: "Loading"; }
  #continue { color: #fff; background: rgba(0, 0, 0, 0.6); border: 2px solid #e2733a; order: 1; }
  #continue[hidden] { display: none; }
  #boot .rw-aboutbtn { position: absolute; right: calc(24px + var(--sr)); top: calc(16px + var(--st)); min-width: 96px; height: 48px; font: inherit; font-size: 16px; font-weight: 700; color: #fff; background: rgba(0,0,0,0.6); border: 2px solid #e2733a; border-radius: 999px; cursor: pointer; touch-action: manipulation; }
  #bootcredit, #bootver { position: absolute; bottom: calc(8px + var(--sb)); margin: 0; padding: 1px 6px; border-radius: 4px; font-size: 11px; line-height: 14px; color: #fff; background: rgba(0, 0, 0, 0.6); letter-spacing: 0.02em; }
  #bootcredit { left: calc(8px + var(--sl)); }
  #bootver { right: calc(8px + var(--sr)); letter-spacing: 0.06em; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #14110f; z-index: 60; font-size: 20px; text-align: center; padding: 24px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Rustwater game view"></canvas>
<div id="ui"></div>
<div id="boot">
  <h1>RUSTWATER</h1>
  <button id="aboutbtn" class="rw-aboutbtn" type="button">About</button>
  <p id="bootmsg">Loading the island&hellip;</p>
  <div id="bootbtns">
    <button id="continue" type="button" hidden>Continue</button>
    <button id="play" type="button" disabled></button>
  </div>
  <p id="bootcredit">Map data (c) OpenStreetMap contributors, ODbL</p>
  <p id="bootver" class="rw-ver">v{{VERSION}}</p>
</div>
<div id="rotate">Turn your phone sideways to play</div>
<script type="module" src="game.js"></script>
</body>
</html>
