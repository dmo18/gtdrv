# Commits whose message contains [wip] are work in progress saved mid-task: they are
# neither checked nor published, so half-finished work never reaches the live site and
# does not send a failure email for every save. Every publishing commit (no [wip]) runs
# the full check, and nothing is published unless it passes.
# Checks the game and, on the repository's default branch, publishes it as a public
# website with GitHub Pages.
name: Check and publish
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[wip]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Refuse to publish a version that is already live. [wip] commits and
      # branches never publish, so they are not checked.
      - name: Version must differ from release/last.json
        if: github.ref_name == github.event.repository.default_branch && github.event_name == 'push' && !contains(github.event.head_commit.message, '[wip]')
        run: |
          new=$(node -p "require('./package.json').version")
          old=$(node -p "require('./release/last.json').version")
          if [ "$new" = "$old" ]; then
            echo "::error::version $new equals release/last.json; run npm run bump"
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch && github.event_name == 'push' && !contains(github.event.head_commit.message, '[wip]')
        with:
          path: dist
  # Headless browser check (build, phone size Chromium, fails on any page error). Not a
  # gate: playwright is not in package.json (no dependency may be added here), so it is
  # installed for this job only, and the runner's software WebGL speed is untested. It runs
  # next to the blocking check and never holds back publishing. Promote it to `needs` of
  # publish once it has passed on the runner for a while.
  smoke:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[wip]')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install playwright and Chromium for this job only
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: npm run smoke
  publish:
    if: github.ref_name == github.event.repository.default_branch && github.event_name == 'push' && !contains(github.event.head_commit.message, '[wip]')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the published version
        run: |
          v=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
            echo "tag v$v already exists"
          else
            git tag "v$v" "$GITHUB_SHA"
            git push origin "v$v"
          fi
